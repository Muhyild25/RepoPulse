[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repopulse"
version = "0.1.0"
description = "GitHub Profil & Repo Sağlık Denetçisi CLI aracı"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "RepoPulse Contributors" }
]
dependencies = [
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
repopulse = "repopulse.cli:app"

[tool.setuptools.packages.find]
include = ["repopulse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
